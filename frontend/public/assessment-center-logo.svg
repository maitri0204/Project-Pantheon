<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180" role="img" aria-label="Assessment Center logo">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD36E"/>
      <stop offset="60%" stop-color="#FFB84D"/>
      <stop offset="100%" stop-color="#FF9A2E"/>
    </linearGradient>
    <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- gold orb -->
  <circle cx="86" cy="86" r="64" fill="url(#g1)" filter="url(#f1)" />

  <!-- monogram: A and C -->
  <g transform="translate(44,46)" fill="#09121A">
    <path d="M18 82 L34 20 L50 82 Z" fill="#09121A" opacity="0.98" />
    <path d="M64 32 C64 14 48 6 36 6 C16 6 6 22 6 40 C6 58 20 76 40 76 C52 76 64 70 64 58 L52 58 C52 68 44 72 40 72 C24 72 12 58 12 40 C12 22 28 12 40 12 C48 12 58 16 58 28 L64 32 Z" fill="#09121A" opacity="0.9"/>
  </g>

  <!-- text -->
  <g transform="translate(140,102)">
    <text x="0" y="-6" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f1724">Assessment</text>
    <text x="0" y="28" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#0f1724" opacity="0.85">Center</text>
  </g>

</svg>
